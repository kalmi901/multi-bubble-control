[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "multi-bubble-control"
version = "0.0.1"
description = "GPU-accelerated multi-bubble dynamics and reinforcement learning framework for collective acoustic bubble control."
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "scipy",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "pre-commit",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100